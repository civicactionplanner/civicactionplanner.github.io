<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Planner tutorial stage</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=EB+Garamond:wght@600;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#0032A0;font-family:Jost,system-ui,sans-serif}
  #site{position:absolute;inset:0;width:1920px;height:1080px;border:0;background:#fff}
  /* ---- Finn, the official MDC mascot (used with permission) ---- */
  #guide{position:absolute;right:24px;bottom:10px;width:400px;z-index:20;animation:bob 2.8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  #guide img{width:100%;display:block;filter:drop-shadow(0 10px 22px rgba(0,20,70,.35))}
  /* ---- speech bubble ---- */
  #bubble{position:absolute;right:430px;bottom:150px;max-width:700px;background:#FFFFFF;border:4px solid #0032A0;border-radius:22px;
    padding:22px 28px;font-size:30px;line-height:1.4;color:#13233F;z-index:21;box-shadow:0 12px 30px rgba(0,20,70,.25);
    opacity:0;transform:translateY(12px);transition:opacity .35s,transform .35s}
  #bubble.on{opacity:1;transform:translateY(0)}
  #bubble::after{content:"";position:absolute;right:-24px;bottom:34px;border:14px solid transparent;border-left-color:#0032A0}
  /* ---- intro / end cards ---- */
  .card{position:absolute;inset:0;background:#0032A0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;
    color:#FBFBF9;text-align:center;transition:opacity .6s;opacity:1}
  .card.off{opacity:0;pointer-events:none}
  .card h1{font-family:'EB Garamond',Georgia,serif;font-size:96px;font-weight:600;margin:0;width:1300px;line-height:1.1}
  .card p{font-size:40px;color:#CBD9F7;margin:0}
  .card .url{font-size:48px;font-weight:600;color:#8FB0FF}
  #endcard{opacity:0;pointer-events:none;z-index:15}
  #endcard.on{opacity:1}
</style>
</head>
<body>
<iframe id="site" src="https://civicactionplanner.github.io/"></iframe>

<div id="blackout" style="position:absolute;inset:0;background:#000;z-index:40"></div>
<div class="card" id="introcard">
  <h1>How to use the Civic Action Scorecard Planner</h1>
  <p>A two minute tour with Finn</p>
</div>

<div class="card" id="endcard">
  <h1>Plan it here. Do it out there.<br>Prove it in EngageMDC.</h1>
  <p class="url">civicactionplanner.github.io</p>
  <p>A free, unofficial student planning tool</p>
</div>

<div id="bubble"></div>
<div id="guide">
  <img id="finn" src="finn_0.png" alt="Finn, the Miami Dade College shark mascot">
</div>

<script>
  const bubble = document.getElementById("bubble");
  const finn = document.getElementById("finn");
  const FRAMES = ["finn_0.png", "finn_1.png", "finn_2.png"];
  FRAMES.forEach(f => { const i = new Image(); i.src = f; });
  let talkTimer = null, step = 0;
  const PATTERN = [1, 2, 1, 0, 2, 1, 2, 0, 1, 2];
  function startFlaps(){
    stopFlaps();
    talkTimer = setInterval(() => { finn.src = FRAMES[PATTERN[step++ % PATTERN.length]]; }, 95);
  }
  function stopFlaps(){
    if (talkTimer) clearInterval(talkTimer);
    talkTimer = null; finn.src = FRAMES[0];
  }
  window.setBubble = function(text){
    if (!text){ bubble.classList.remove("on"); stopFlaps(); return; }
    bubble.textContent = text;
    bubble.classList.add("on");
  };
  window.startTalking = startFlaps;
  window.stopTalking = stopFlaps;
  window.hideIntro = function(){ document.getElementById("introcard").classList.add("off"); };
  window.go = function(){ document.getElementById("blackout").style.display = "none"; };
  window.showEnd = function(){ document.getElementById("endcard").classList.add("on"); };
</script>
</body>
</html>
