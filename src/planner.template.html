<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civic Action Scorecard Planner</title>
<meta name="description" content="Plan, track, and prepare Civic Action Scorecard submissions: every action and point value, documentation requirements, reflection prompts, and live progress toward Bronze, Silver, and Gold.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --bg:#FFF8F0; --surface:#FFFFFF; --surface-2:#F7EFE3; --ink:#1A1A2E; --ink-2:#5C574F; --ink-3:#8A8377;
  --line:#E9DFD0; --line-2:#D9CDBB; --focus:#1B3F7A;
  --de:#2C5AA0; --es:#0E8F7A; --cw:#E0401C; --ac:#D4A400; --si:#7A4DB8; --ia:#5B6472;
  --de-soft:#E3EBF7; --es-soft:#DDF2ED; --cw-soft:#FBE3DC; --ac-soft:#F8EFCF; --si-soft:#ECE3F7; --ia-soft:#E6E8EC;
  --ok:#0E8F7A; --ok-bg:#DDF2ED; --warn:#8A6A00; --warn-bg:#F8EFCF; --info-bg:#E3EBF7;
  --bronze:#B06F3B; --silver:#7C8794; --gold:#C79A16;
  --shadow:0 1px 0 rgba(26,26,46,.04), 0 6px 20px rgba(26,26,46,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14172A; --surface:#1C2038; --surface-2:#232846; --ink:#F3EDE3; --ink-2:#BDB4A5; --ink-3:#8F877A;
    --line:#2C3150; --line-2:#3A4062; --focus:#9DB8F0;
    --de:#5E86D6; --es:#1FA88E; --cw:#CC4028; --ac:#B98D14; --si:#9A72DA; --ia:#7C8698;
    --de-soft:#232E4A; --es-soft:#1B3A38; --cw-soft:#3C2429; --ac-soft:#373120; --si-soft:#2E2748; --ia-soft:#272B3A;
    --ok:#3BD3B5; --ok-bg:#1B3A38; --warn:#E3B84A; --warn-bg:#373120; --info-bg:#232E4A;
    --bronze:#D08A52; --silver:#A9B3BF; --gold:#E4B534;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#14172A; --surface:#1C2038; --surface-2:#232846; --ink:#F3EDE3; --ink-2:#BDB4A5; --ink-3:#8F877A;
  --line:#2C3150; --line-2:#3A4062; --focus:#9DB8F0;
  --de:#5E86D6; --es:#1FA88E; --cw:#CC4028; --ac:#B98D14; --si:#9A72DA; --ia:#7C8698;
  --de-soft:#232E4A; --es-soft:#1B3A38; --cw-soft:#3C2429; --ac-soft:#373120; --si-soft:#2E2748; --ia-soft:#272B3A;
  --ok:#3BD3B5; --ok-bg:#1B3A38; --warn:#E3B84A; --warn-bg:#373120; --info-bg:#232E4A;
  --bronze:#D08A52; --silver:#A9B3BF; --gold:#E4B534;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.disp{font-family:"Bebas Neue","Barlow Condensed","Arial Narrow",Impact,sans-serif;letter-spacing:.01em;font-weight:400}
.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 80px}
.nojs{max-width:1080px;margin:14px auto 0;padding:10px 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--info-bg);font-size:14px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;flex-wrap:wrap}
.brand h1{margin:0;font-size:26px;line-height:1}
.brand .yr{font-size:13px;color:var(--ink-2)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.nav{display:flex;gap:6px;flex-wrap:wrap;flex:1 0 100%}
.nav a{text-decoration:none;font-size:12.5px;padding:5px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;background:var(--surface)}
.nav a .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.nav a:hover{border-color:var(--c);color:var(--ink)}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.btn:hover{color:var(--ink);border-color:var(--ink-3)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.name{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px;min-width:160px}
.name::placeholder{color:var(--ink-3)}

/* summary */
.summary{display:grid;grid-template-columns:minmax(280px,1.1fr) 1.4fr;gap:20px;margin:22px 0 18px}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.hero .lbl{font-size:13px;color:var(--ink-2)}
.hero .num{font-size:104px;line-height:.9;letter-spacing:0;margin-top:2px}
.hero .num small{font-size:26px;color:var(--ink-3);margin-left:6px;letter-spacing:.02em}
.meter{position:relative;height:14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line);margin:14px 0 22px}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--de);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.meter .fill.appr{background:var(--ok);opacity:.55}
.meter .tick{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--line-2)}
.meter .tick.hit{background:var(--tc)}
.meter .tl{position:absolute;top:18px;transform:translateX(-50%);font-size:12px;color:var(--ink-2);white-space:nowrap}
.meter .tl b{display:block;font-weight:600;color:var(--tc)}
.award{font-size:14px;color:var(--ink-2)}
.award b{color:var(--ink);font-weight:600}
.stages{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:12px}
.stages span b{color:var(--ink);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-content:start}
.tile{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);text-decoration:none;display:block;color:inherit}
.tile:hover{border-color:var(--c)}
.tile .tn{font-size:12.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.tile .tn span:last-child{white-space:nowrap}
.tile .tv{font-size:34px;line-height:1;margin:6px 0 8px}
.tile .tv small{font-size:15px;color:var(--ink-3);letter-spacing:.03em}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:3px;transition:width .4s cubic-bezier(.2,.7,.2,1)}
.tile.ia{grid-column:span 2;display:flex;align-items:center;gap:14px;padding:10px 14px}
.tile.ia .tv{margin:0;font-size:26px}
.tile.ia .tn{flex:1}

/* banner + toast */
.banner{background:var(--info-bg);border:1px solid var(--line-2);border-radius:10px;padding:10px 14px;margin:16px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.banner .sp{flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:50;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* phase view */
.ph{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--pc,var(--de));border-radius:12px;padding:16px 18px 14px;margin:18px 0 6px;box-shadow:var(--shadow)}
.ph .ph-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ph .ph-no{font-size:13px;color:var(--pc,var(--ink-2));letter-spacing:.06em}
.ph h2{margin:0;font-size:32px;line-height:1}
.ph .ph-tag{font-size:13px;color:var(--ink-2);font-style:italic}
.ph .ph-rule{font-size:13px;color:var(--ink-2);margin-top:6px}
.ph .ph-prog{font-size:14px;font-weight:500;margin-top:4px}
.ph .ph-why{font-size:13.5px;color:var(--ink-2);margin-top:6px;max-width:72ch;line-height:1.5}
.ph.locked{border-left-color:var(--line-2);background:var(--surface-2)}
.ph.locked h2{color:var(--ink-3)}
.ph.locked .ph-no{color:var(--ink-3)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* controls */
.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{font-size:12px;opacity:.7;margin-left:4px}
.search{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;min-width:200px}
.search::placeholder{color:var(--ink-3)}
.right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.legend{font-size:13px;color:var(--ink-2);margin:0 0 18px;line-height:1.5;max-width:80ch}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.05em;text-transform:uppercase;font-weight:600;font-size:11.5px;padding:2px 7px;border-radius:5px;line-height:1.4}
.badge.sub{background:var(--warn-bg);color:var(--warn)}
.badge.appr{background:var(--ok-bg);color:var(--ok)}

/* categories */
.cat{margin:0 0 26px}
.cat-h{position:sticky;top:var(--topH,0px);z-index:10;background:var(--bg);padding:12px 0 8px;border-bottom:2px solid var(--c);display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:end}
.cat-h .ct{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.cat-h h2{margin:0;font-size:30px;line-height:1}
.cat-h .code{font-size:13px;color:var(--c)}
.cat-h .tag{font-size:12.5px;color:var(--ink-3);font-style:italic;align-self:center}
.cat-h .cs{font-size:13px;color:var(--ink-2);white-space:nowrap}
.cat-h .cs b{font-size:22px;color:var(--ink);font-family:"Bebas Neue","Barlow Condensed",sans-serif;font-weight:400;letter-spacing:.02em;margin-right:2px}
.cat-h .bar{margin-top:6px;width:160px}
.rows{display:flex;flex-direction:column}
.item{border-bottom:1px solid var(--line)}
.item.hidden{display:none}
.row{display:grid;grid-template-columns:30px 66px 1fr auto 74px 34px;gap:12px;align-items:center;padding:11px 4px 11px 6px;cursor:pointer;border-radius:8px;transition:background .15s}
.row:hover{background:var(--surface)}
.item.on .row{background:var(--soft)}
.tog{width:24px;height:24px;border-radius:6px;border:2px solid var(--line-2);background:var(--surface);display:grid;place-items:center;flex:none;transition:background .15s,border-color .15s}
.tog svg{width:15px;height:15px;opacity:0;transform:scale(.6);transition:transform .15s,opacity .15s}
.item.on .tog{background:var(--c);border-color:var(--c)}
.item.on .tog svg{opacity:1;transform:scale(1)}
.code{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;letter-spacing:.05em;font-size:13px;color:var(--c);text-transform:uppercase}
.tt{font-size:15px;line-height:1.35}
.item.on .tt{font-weight:500}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px;font-size:12.5px;color:var(--ink-2)}
.meta .req{color:var(--ink-3)}
.stp{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);overflow:hidden}
.stp button{border:0;background:transparent;width:30px;height:28px;cursor:pointer;color:var(--ink-2);font-size:16px;line-height:1}
.stp button:hover{background:var(--surface-2);color:var(--ink)}
.stp button:disabled{opacity:.35;cursor:default}
.stp .cnt{min-width:44px;text-align:center;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:14px;letter-spacing:.03em}
.stp select{border:0;background:transparent;height:28px;padding:0 8px;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;color:var(--ink);cursor:pointer}
.pts{text-align:right;line-height:1}
.pts .pv{font-size:28px;color:var(--ink-3)}
.item.on .pts .pv{color:var(--c)}
.pts .pm{font-size:11.5px;color:var(--ink-3);margin-top:3px;font-family:"Barlow Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
.exp{width:30px;height:30px;border-radius:8px;border:1px solid transparent;background:transparent;cursor:pointer;color:var(--ink-3);display:grid;place-items:center}
.exp:hover{border-color:var(--line-2);color:var(--ink)}
.exp svg{width:14px;height:14px;transition:transform .15s}
.item.open .exp svg{transform:rotate(180deg)}
.det{display:none;padding:4px 8px 18px 48px;font-size:14px}
.item.open .det{display:grid;grid-template-columns:1.3fr 1fr;gap:18px 28px}
.det h4{margin:0 0 6px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;letter-spacing:.06em;text-transform:uppercase;font-weight:600;font-size:12px;color:var(--ink-3)}
.det .doc{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:8px;padding:10px 12px;line-height:1.5}
.det .prompt{margin:0 0 4px;line-height:1.45}
.det .prompt b{font-family:"Barlow Condensed",sans-serif;letter-spacing:.05em;text-transform:uppercase;font-size:12.5px;color:var(--c);margin-right:4px}
.det textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);padding:8px 10px;font-size:14px;line-height:1.45;margin:0 0 12px}
.det textarea::placeholder{color:var(--ink-3)}
.det .aside{margin:0;padding-left:18px;line-height:1.5;color:var(--ink-2)}
.det .aside li{margin:0 0 3px}
.det .stat{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.det .stat label{display:flex;gap:8px;align-items:center;cursor:pointer}
.det .stat input{width:16px;height:16px;accent-color:var(--ok)}
.det .dbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.wc{font-size:12px;color:var(--ink-3);margin:-8px 0 10px;text-align:right}
.empty{padding:18px 8px;color:var(--ink-3);font-size:14px;font-style:italic}
.foot{margin-top:30px;border-top:1px solid var(--line);padding-top:16px;font-size:13px;color:var(--ink-2);max-width:78ch;line-height:1.5}
.foot p{margin:0 0 8px}
#print{display:none}

@media (max-width:820px){
  .summary{grid-template-columns:1fr}
  .hero .num{font-size:88px}
  .cat-h{grid-template-columns:1fr auto}
  .cat-h .tag{display:none}
  .item.open .det{grid-template-columns:1fr}
}
@media (max-width:640px){
  .wrap{padding:0 12px 60px}
  .top{position:static}
  .nav{display:none}
  .row{grid-template-columns:28px 1fr 56px 30px;gap:10px;padding:10px 2px}
  .row .code{grid-column:2;font-size:12px}
  .row .tx{grid-column:2}
  .row .stp{grid-column:2;justify-self:start}
  .row .pts{grid-column:3;grid-row:1 / span 3;align-self:start}
  .row .exp{grid-column:4;grid-row:1 / span 3;align-self:start}
  .row .tog{grid-row:1 / span 3;align-self:start;margin-top:2px}
  .det{padding-left:8px}
  .pts .pv{font-size:24px}
  .tile .tv{font-size:28px}
  .cat-h h2{font-size:26px}
  .cat-h .bar{width:100px}
  .hero .num{font-size:76px}
  .right{margin-left:0}
  .name{min-width:0;flex:1}
}
@media (prefers-reduced-motion: reduce){
  .meter .fill,.bar i,.tog,.tog svg,.row,.exp svg,.toast{transition:none}
}
@media print{
  body{background:#fff;color:#000}
  #app,.toast{display:none}
  #print{display:block;font-family:Georgia,"Times New Roman",serif;font-size:11pt;color:#000}
  #print h1{font-size:18pt;margin:0 0 2pt}
  #print .sub{font-size:10pt;color:#333;margin:0 0 10pt}
  #print table{width:100%;border-collapse:collapse;margin:0 0 10pt}
  #print th,#print td{border:1px solid #999;padding:3pt 5pt;text-align:left;vertical-align:top;font-size:9.5pt}
  #print th{background:#eee}
  #print td.r,#print th.r{text-align:right;white-space:nowrap}
  #print tr.cat td{background:#f4f4f4;font-weight:bold}
  #print .tot{font-size:12pt;margin:6pt 0}
  #print .sig{margin-top:18pt;display:flex;gap:30pt}
  #print .sig div{flex:1;border-top:1px solid #000;padding-top:3pt;font-size:9pt}
  #print .note{font-size:8.5pt;color:#444;margin-top:12pt}
}
</style>

<body>
<div id="app"><div class="nojs"><strong>Scripts are not running in this viewer.</strong> You are seeing a read-only copy of the planner. To use it (check actions, see totals, draft reflections), open this file in Chrome, Safari, Edge, or Firefox, or open the hosted link your sender gave you.</div>__PRERENDER__</div>
<div id="print"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script id="cas-config" type="application/json">__CONFIG__</script>
<script>
(function(){
  "use strict";
  var CFG = JSON.parse(document.getElementById("cas-config").textContent);
  var DATA = {cats: CFG.cats, actions: CFG.actions};
  var TIERS = CFG.tiers.map(function(t){ return {n:t.name, p:t.points, c:"var(--"+t.name.toLowerCase()+")"}; });
  var TOP = TIERS[TIERS.length-1].p;
  var LS_KEY = "cas-planner-v2";
  var CATVAR = {DE:"--de",ES:"--es",CW:"--cw",AC:"--ac",SI:"--si",IA:"--ia"};
  var byCode = {};
  DATA.actions.forEach(function(a){ byCode[a.code] = a; });

  // ---------- state ----------
  function blank(){ return {v:2, name:"", counts:{}, ia:10, sub:{}, appr:{}, notes:{}, unlocked:{}, updated:0}; }
  function normalize(s){
    var b = blank();
    if (!s || typeof s !== "object") return b;
    b.name = typeof s.name === "string" ? s.name : "";
    b.counts = s.counts && typeof s.counts === "object" ? s.counts : {};
    b.ia = typeof s.ia === "number" ? s.ia : 10;
    b.sub = s.sub && typeof s.sub === "object" ? s.sub : {};
    b.appr = s.appr && typeof s.appr === "object" ? s.appr : {};
    b.notes = s.notes && typeof s.notes === "object" ? s.notes : {};
    b.unlocked = s.unlocked && typeof s.unlocked === "object" ? s.unlocked : {};
    b.updated = typeof s.updated === "number" ? s.updated : 0;
    Object.keys(b.counts).forEach(function(k){ if (!byCode[k] || !(b.counts[k] > 0)) delete b.counts[k]; });
    return b;
  }
  function loadState(){
    try { var raw = localStorage.getItem(LS_KEY); if (raw) return normalize(JSON.parse(raw)); } catch(e){}
    return blank();
  }
  var state = loadState();
  var filter = "all", query = "", openSet = {};
  var route = {view:"home"};
  var lastTotal = 0;
  function saveLocal(){ try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch(e){} }
  function checkUnlocks(){
    var t = totals().all.checked, msg = null;
    TIERS.forEach(function(tr){
      var key = tr.n.toLowerCase();
      if (lastTotal < tr.p && t >= tr.p && !state.unlocked[key]){
        state.unlocked[key] = true;
        var ph = null;
        CFG.phases.forEach(function(p){ if (p.unlockPoints === tr.p) ph = p; });
        msg = ph ? tr.n+" reached. Phase "+ph.number+" is open." : tr.n+" reached.";
      } else if (t >= tr.p) state.unlocked[key] = true;
    });
    lastTotal = t;
    if (msg) toast(msg);
  }
  function commit(){ state.updated = Date.now(); checkUnlocks(); saveLocal(); renderSummary(); updateCatHeads(); updatePhaseHead(); }

  // ---------- math ----------
  function ptsFor(a){
    var n = state.counts[a.code] || 0;
    if (!n) return 0;
    if (a.variable) return state.ia;
    return a.pts * n;
  }
  function totals(){

      var it = document.getElementById("item-"+a.code); if (!it) return;
      var want = !!openSet[a.code], is = it.classList.contains("open");
      if (want && !is){ var d = document.getElementById("det-"+a.code); d.innerHTML = renderDetails(a); wireDetails(it, a); it.classList.add("open"); }
      if (!want && is){ it.classList.remove("open"); document.getElementById("det-"+a.code).innerHTML = ""; }
      var b = it.querySelector(".exp"); if (b) b.setAttribute("aria-expanded", String(want));
    });
  }
  function refreshItem(a){
    var old = document.getElementById("item-"+a.code); if (!old) return;
    var tmp = document.createElement("div"); tmp.innerHTML = renderItem(a);
    var nw = tmp.firstChild; old.replaceWith(nw); wireItem(nw);
  }
  function wireAll(){ Array.prototype.forEach.call(document.querySelectorAll(".item"), wireItem); }
  function wireItem(it){
    var code = it.dataset.code, a = byCode[code], row = it.querySelector(".row");
    function toggle(){
      var n = state.counts[code] || 0;
      if (n){ delete state.counts[code]; delete state.sub[code]; delete state.appr[code]; } else state.counts[code] = 1;
      commit(); refreshItem(a); renderChips();
    }
    row.addEventListener("click", function(e){ if (e.target.closest("[data-stop]")) return; toggle(); });
    row.addEventListener("keydown", function(e){
      if (e.target !== row) return;
      if (e.key===" " || e.key==="Enter"){ e.preventDefault(); toggle(); }
    });
    it.querySelector(".exp").addEventListener("click", function(e){
      e.stopPropagation(); openSet[code] = !openSet[code]; syncOpen();
    });
    var stp = it.querySelector(".stp");
    if (stp){
      Array.prototype.forEach.call(stp.querySelectorAll("button"), function(b){
        b.addEventListener("click", function(e){
          e.stopPropagation();
          var d = parseInt(b.dataset.d, 10), n = (state.counts[code]||0) + d;
          if (n < 1) return; if (!a.unlimited && n > a.max) return; if (a.unlimited && n > 10) return;
          state.counts[code] = n; commit(); refreshItem(a);
          var nb = document.querySelector("#item-"+code+" .stp button[data-d='"+d+"']"); if (nb && !nb.disabled) nb.focus();
        });
      });
      var sel = stp.querySelector("select");
      if (sel){
        sel.addEventListener("click", function(e){ e.stopPropagation(); });
        sel.addEventListener("change", function(e){ e.stopPropagation(); state.ia = parseInt(sel.value,10); commit(); refreshItem(a); });
      }
    }
    if (it.classList.contains("open")) wireDetails(it, a);
  }
  function wireDetails(it, a){
    var code = a.code;
    Array.prototype.forEach.call(it.querySelectorAll(".det textarea"), function(t){
      t.addEventListener("input", function(){
        var nt = state.notes[code] || (state.notes[code] = {});
        nt[t.dataset.key] = t.value; state.updated = Date.now(); saveLocal();
        var wc = it.querySelector('.wc[data-wc="'+t.dataset.key+'"]'); if (wc) wc.textContent = t.value.trim() ? words(t.value)+" words" : "";
      });
    });
    Array.prototype.forEach.call(it.querySelectorAll(".det input[type=checkbox]"), function(cb){
      cb.addEventListener("change", function(){
        var st = cb.dataset.st;
        if (st === "sub"){ if (cb.checked) state.sub[code] = true; else { delete state.sub[code]; delete state.appr[code]; } }
        if (st === "appr"){ if (cb.checked){ state.appr[code] = true; state.sub[code] = true; } else delete state.appr[code]; }
        if ((state.sub[code] || state.appr[code]) && !state.counts[code]) state.counts[code] = 1;
        commit(); renderChips();
        var was = openSet[code]; openSet[code] = true; refreshItem(a); if (!was) openSet[code] = true;
      });
    });
    var copyBtn = it.querySelector('[data-act="copy"]');
    if (copyBtn) copyBtn.addEventListener("click", function(){
      copyText(reflectionText(a)).then(function(){ toast("Reflection copied. Paste it into the Hub's Add Impact form."); }, function(){ toast("Copy failed. Select the text and copy it manually."); });
    });
    var hubBtn = it.querySelector('[data-act="hub"]');
    if (hubBtn) hubBtn.addEventListener("click", function(){ window.open(CFG.hubUrl, "_blank", "noopener"); });
  }
  function reflectionText(a){
    var nt = state.notes[a.code] || {};
    var lines = [a.code+" · "+a.title+" ("+(a.variable ? state.ia : a.pts)+" pts"+(state.counts[a.code] > 1 ? ", completion ×"+state.counts[a.code] : "")+")"];
    if (a.doc) lines.push("Documentation: "+a.doc);
    lines.push("");
    [["what","WHAT?"],["sowhat","SO WHAT?"],["nowwhat","NOW WHAT?"]].forEach(function(p){
      if (!a[p[0]]) return;
      lines.push(p[1]+" "+a[p[0]]); lines.push(nt[p[0]] ? nt[p[0]] : "[your answer]"); lines.push("");
    });
    return lines.join("\n").trim();
  }

  // ---------- export / import / share ----------
  function exportJSON(){
    var payload = JSON.stringify({app:"civic-action-planner", edition:CFG.edition, exported:new Date().toISOString(), state:state}, null, 2);
    var blob = new Blob([payload], {type:"application/json"});
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    var nm = (state.name || "student").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase();
    a.download = "civic-action-progress-"+nm+"-"+todayISO()+".json"; document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    toast("Backup downloaded.");
  }
  function importJSON(e){
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      try {
        var obj = JSON.parse(r.result); var s = obj && obj.state ? obj.state : obj;
        state = normalize(s); state.updated = Date.now(); checkUnlocks(); saveLocal();
        document.getElementById("name").value = state.name; renderCats(); renderChips(); renderSummary(); toast("Backup imported.");
      } catch(err){ toast("That file isn't a planner backup."); }
      e.target.value = "";
    };
    r.readAsText(f);
  }
  function shareLink(){
    var slim = {v:2, name:state.name, counts:state.counts, ia:state.ia, sub:state.sub, appr:state.appr};
    var url = location.href.split("#")[0] + "#s=" + b64url(JSON.stringify(slim));
    copyText(url).then(function(){ toast("Share link copied (checks and statuses only, not drafts)."); }, function(){ toast("Couldn't copy. The link is in the address bar."); location.hash = "s=" + b64url(JSON.stringify(slim)); });
  }
  function checkSharedHash(){
    var m = /[#&]s=([A-Za-z0-9_-]+)/.exec(location.hash); if (!m) return;
    var incoming;
    try { incoming = normalize(JSON.parse(unb64url(m[1]))); } catch(e){ return; }
    var t = 0; DATA.actions.forEach(function(a){ var n = incoming.counts[a.code]||0; if (n) t += a.variable ? incoming.ia : a.pts*n; });
    var b = document.getElementById("banner");
    b.innerHTML = '<div class="banner"><span class="sp">This link carries a shared progress snapshot'+(incoming.name ? ' for <b>'+esc(incoming.name)+'</b>' : '')+' worth <b>'+t+' points</b>. Load it here? It replaces the checks saved in this browser (drafts are kept).</span><button class="btn primary" id="sh-load" type="button">Load snapshot</button><button class="btn" id="sh-ignore" type="button">Ignore</button></div>';
    document.getElementById("sh-load").addEventListener("click", function(){
      incoming.notes = state.notes; state = incoming; state.updated = Date.now(); checkUnlocks(); saveLocal();
      document.getElementById("name").value = state.name; renderCats(); renderChips(); renderSummary(); b.innerHTML = "";
      history.replaceState(null, "", location.pathname + location.search); toast("Snapshot loaded.");
    });
    document.getElementById("sh-ignore").addEventListener("click", function(){ b.innerHTML = ""; history.replaceState(null, "", location.pathname + location.search); });
  }

  // ---------- print ----------
  function buildPrint(){
    var t = totals(), total = t.all.checked, ti = tierInfo(total);
    var rows = "";
    DATA.cats.forEach(function(c){
      var acts = DATA.actions.filter(function(a){ return a.cat===c.id && state.counts[a.code]; });
      if (!acts.length) return;
      rows += '<tr class="cat"><td colspan="5">'+esc(c.name)+'</td></tr>';
      acts.forEach(function(a){
        var n = state.counts[a.code];
        rows += '<tr><td>'+a.code+'</td><td>'+esc(a.title)+(n>1?' (×'+n+')':'')+'</td><td class="r">'+ptsFor(a)+'</td><td>'+(state.sub[a.code]||state.appr[a.code]?'Yes':'')+'</td><td>'+(state.appr[a.code]?'Yes':'')+'</td></tr>';
      });
      rows += '<tr><td></td><td><i>'+esc(c.name)+' subtotal</i></td><td class="r"><b>'+t[c.id].checked+'</b></td><td></td><td></td></tr>';
    });
    if (!rows) rows = '<tr><td colspan="5">No actions checked yet.</td></tr>';
    document.getElementById("print").innerHTML =
      '<h1>Civic Action Planning Sheet</h1>' +
      '<p class="sub">'+esc(CFG.edition)+' Civic Action Scorecard · '+(state.name ? 'Student: '+esc(state.name)+' · ' : '')+'Printed '+todayISO()+'</p>' +
      '<table><thead><tr><th>#</th><th>Civic action</th><th class="r">Points</th><th>Submitted</th><th>Approved</th></tr></thead><tbody>'+rows+'</tbody></table>' +
      '<p class="tot">Total points: <b>'+total+'</b> · Submitted: '+t.all.sub+' · Approved: '+t.all.appr+'</p>' +
      '<p class="tot">Award level on paper: <b>'+(ti.earned ? ti.earned.n : 'none yet')+'</b> ('+TIERS.map(function(x){return x.n+" "+x.p;}).join(" / ")+')</p>' +
      '<div class="sig"><div>Student signature / date</div><div>Reviewed / approved by (iCED)</div></div>' +
      '<p class="note">'+esc(CFG.disclaimer)+' '+esc(CFG.license)+'</p>';
  }

  lastTotal = totals().all.checked;
  TIERS.forEach(function(tr){ if (lastTotal >= tr.p) state.unlocked[tr.n.toLowerCase()] = true; });
  renderShell();
})();
</script>
