# Weekly canary: runs the full suite against the live site so drift
# (Pages, Firebase domains, data, contrast, weight budget) surfaces as a
# failed run and an email, not as a student's bug report.
name: Weekly live canary

on:
  schedule:
    - cron: "0 12 * * 1" # Mondays, 12:00 UTC (8am Miami)
  workflow_dispatch:

jobs:
  live-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          BASE_URL: https://civicactionplanner.github.io/
